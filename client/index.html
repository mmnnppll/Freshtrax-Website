    <!--
      Consent-aware analytics.
      Nothing that sets cookies runs until the visitor clicks Accept on the
      cookie banner (stored in localStorage as freshtrax_cookie_consent).
      - Google (GA4 + Ads) uses Consent Mode v2: defaults to "denied", so it
        sends only cookieless pings until consent is granted.
      - Meta Pixel starts revoked and sends nothing until granted.
      - Microsoft Clarity is not loaded at all until granted.
      The banner calls window.ftConsent.grant() / .deny() (see lib/analytics.ts).
    -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      (function () {
        var stored = null;
        try { stored = localStorage.getItem('freshtrax_cookie_consent'); } catch (e) {}
        var granted = stored === 'accepted';
        var state = granted ? 'granted' : 'denied';

        gtag('consent', 'default', {
          ad_storage: state,
          ad_user_data: state,
          ad_personalization: state,
          analytics_storage: state,
          wait_for_update: 500
        });
        gtag('js', new Date());
        gtag('config', 'G-JL2ZW7QSGF');
        gtag('config', 'AW-18115161423');

        // Meta Pixel base code
        !function(f,b,e,v,n,t,s)
        {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
        n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s)}(window, document,'script',
        'https://connect.facebook.net/en_US/fbevents.js');
        fbq('consent', granted ? 'grant' : 'revoke');
        fbq('init', '2178769866364740');
        fbq('track', 'PageView');

        var clarityLoaded = false;
        function loadClarity() {
          if (clarityLoaded) return;
          clarityLoaded = true;
          (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
          })(window, document, "clarity", "script", "wrqm1a9525");
        }
        if (granted) loadClarity();

        window.ftConsent = {
          grant: function () {
            gtag('consent', 'update', {
              ad_storage: 'granted',
              ad_user_data: 'granted',
              ad_personalization: 'granted',
              analytics_storage: 'granted'
            });
            fbq('consent', 'grant');
            loadClarity();
          },
          deny: function () {
            gtag('consent', 'update', {
              ad_storage: 'denied',
              ad_user_data: 'denied',
              ad_personalization: 'denied',
              analytics_storage: 'denied'
            });
            fbq('consent', 'revoke');
            // If Clarity was loaded under an earlier Accept, tell it to stop
            // using cookies for the rest of this visit.
            if (clarityLoaded && window.clarity) window.clarity('consent', false);
          }
        };
      })();
    </script>
