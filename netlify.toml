[build]
  command = "pnpm install && pnpm run build"
    publish = "dist/public"
      functions = "netlify/functions"

      [[redirects]]
        from = "/api/send-lead-notification"
          to = "/.netlify/functions/send-lead-notification"
            status = 200

            [[redirects]]
              from = "/api/contact"
                to = "/.netlify/functions/contact"
                  status = 200

                  [[redirects]]
                    from = "/*"
                      to = "/index.html"
                        status = 200
